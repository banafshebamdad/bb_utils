#
# Config: preprocessing_segmentation.yaml
# Author: Banafshe Bamdad + Claude Code
# Created: 2026-04-21 CET
#
# Pipeline: bb-run-segmentation (bb_utils)
#
# Example configuration for the InCrowd-VI dataset.
# Images and output paths are supplied directly via CLI --images-dir and
# --output-dir flags; this file contains model settings only.
#
# model:
#   backend:              "mask2former" # "yolo" # "deeplab"
#   model_name:           "/home/ubuntu/.cache/huggingface/hub/mask2former-swin-large-coco-panoptic-safetensors" # "facebook/mask2former-swin-large-coco-panoptic" # "facebook/mask2former-swin-large-coco-instance" # "yolov8n-seg"
#   device:               "cuda"
#   confidence_threshold: 0.5    # [yolo + mask2former] minimum detection confidence in (0, 1)
#   iou_threshold:        0.50   # [yolo only]          NMS IoU threshold in (0, 1); ignored by mask2former / deeplab
#   mask_threshold:       0.50   # [yolo only]          pixel-level mask binarization threshold in (0, 1); default 0.5; ignored by mask2former
#   target_classes:       [0]    # [yolo + mask2former] COCO class IDs to include; 0 = person
#                                # NOTE: DeepLabBackend uses Pascal VOC class IDs; set target_classes: [15] for person
#   mask_dilation_px:     0      # [yolo + mask2former + deeplab] dilation radius in pixels; 0 = no dilation
#   segmentation_type:    "panoptic" # [mask2former only]   "instance" or "panoptic"; ignored by yolo / deeplab

# ---------------------------------------------------------------------------
# Optional pre-rotation (applied before segmentation; mask rotated back after)
# ---------------------------------------------------------------------------
#
# Option A — same rotation for all images:
preprocessing:
  pre_rotation_deg: 90    # rotation magnitude in degrees; must be a multiple of 90
  rotation_direction: cw  # "cw" (clockwise, default) or "ccw" (counter-clockwise)
  rotate_mask_back: false  # rotate mask back to original orientation (default: true)
#
# Option B — per-camera rotation (camera inferred from filename: *_L_* / *_R_*):
# preprocessing:
#   rotation_direction: cw   # global default direction; overridden per-camera by camera_directions 
#   camera_directions:       # optional per-camera direction overrides
#     L: cw                  # left camera: clockwise
#     R: ccw                 # right camera: counter-clockwise
#   rotate_mask_back: false  # skip rotating mask back to original orientation
#   cameras:
#     L: 90    # left camera: 90° in the direction set by camera_directions.L (cw)
#     R: 90   # right camera: 90° in the direction set by camera_directions.R (ccw)
#
# Option C — per-camera with global fallback:
# preprocessing:
#   pre_rotation_deg: 90    # used when camera cannot be detected from filename
#   rotation_direction: cw  # global default; overridden per-camera by camera_directions
#   camera_directions:      # optional per-camera direction overrides
#     L: cw
#     R: ccw
#   rotate_mask_back: true
#   cameras:
#     L: 90
#     R: 90

# ---------------------------------------------------------------------------
# Sam3Backend example (set backend: "sam3" and adjust class_to_text)
# ---------------------------------------------------------------------------
# Prerequisites:
#   1. Install sam3:
#        git clone https://github.com/facebookresearch/sam3.git && cd sam3 && pip install -e .
#   2. Request HuggingFace access at https://huggingface.co/facebook/sam3
#   3. Authenticate:  hf auth login
#
# On first run the checkpoint (~3.4 GB for sam3, ~3.7 GB for sam3.1) is
# downloaded automatically to ~/.cache/huggingface/hub/.
# Set checkpoint_path to a local .pt file to skip the download.
#
# NOTE: target_classes uses COCO class IDs (0 = person) mapped via class_to_text.
#       The class_to_text dict is open-vocabulary, any text phrase is valid.
#
model:
  backend:              "sam3"
  version:              "sam3"          # "sam3" or "sam3.1"
  checkpoint_path:      null            # null = auto-download from HuggingFace
  device:               "cuda"
  confidence_threshold: 0.5             # minimum detection score in (0, 1)
  class_to_text:                        # optional overrides for the built-in COCO map
    0: "person"                         # COCO class 0 -> text prompt "person"
  target_classes:       [0]             # COCO class IDs; 0 = person
  mask_dilation_px:     0

# ---------------------------------------------------------------------------
# DeepLabBackend example (set backend: "deeplab" and adjust target_classes)
# ---------------------------------------------------------------------------
# model:
#   backend:              "deeplab"
#   backbone:             "resnet101"       # "resnet50" or "resnet101"
#   pretrained_weights:   "coco_voc"        # "coco_voc" = complete torchvision pretrained model (backbone+ASPP+head, fully trained); or path to .pth for custom DeepLabv3+ checkpoint; or null
#   device:               "cuda"
#   num_classes:          21                # Pascal VOC label space
#   atrous_rates:         [12, 24, 36]      # ASPP dilation rates — ignored when pretrained_weights: "coco_voc"; use [6,12,18] for output_stride=16 custom checkpoints
#   aspp_channels:        256               # ASPP output channels — ignored when pretrained_weights: "coco_voc"
#   segmentation_mode:    "argmax"          # "argmax" or "threshold"
#   mask_threshold:       0.5               # used only when segmentation_mode: "threshold"
#   target_classes:       [15]              # Pascal VOC class 15 = person (NOT COCO class 0!)
#   mask_dilation_px:     0
