#
# Config: preprocessing_segmentation.yaml
# Author: Banafshe Bamdad + Claude Code
# Created: 2026-04-21 CET
#
# Pipeline: bb-run-segmentation (bb_utils)
#
# Example configuration for the InCrowd-VI dataset.
# Images and output paths are supplied directly via CLI --images-dir and
# --output-dir flags; this file contains model settings only.
#
model:
  backend:              "mask2former" # "yolo"
  model_name:           "/home/ubuntu/.cache/huggingface/hub/mask2former-swin-large-coco-panoptic-safetensors" # "facebook/mask2former-swin-large-coco-panoptic" # "facebook/mask2former-swin-large-coco-instance" # "yolov8n-seg"
  device:               "cuda"
  confidence_threshold: 0.6    # [yolo + mask2former] minimum detection confidence in (0, 1)
  iou_threshold:        0.50   # [yolo only]          NMS IoU threshold in (0, 1); ignored by mask2former
  mask_threshold:       0.50   # [yolo only]          pixel-level mask binarization threshold in (0, 1); default 0.5; ignored by mask2former
  target_classes:       [0]    # [yolo + mask2former] COCO class IDs to include; 0 = person
  mask_dilation_px:     0      # [yolo + mask2former] dilation radius in pixels; 0 = no dilation
  segmentation_type:    "panoptic" # [mask2former only]   "instance" or "panoptic"; ignored by yolo
