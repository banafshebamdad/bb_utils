[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bb-utils"
version = "0.1.0"
description = "Small utilities for SP-SCore development"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5.0",
    "PyYAML>=6.0",
    "tqdm>=4.65.0"
]

[project.scripts]
inspect-npz = "bb_utils.utils.inspect_npz:main"
generate-superpoint-labels = "bb_utils.label_generation.incrowdvi_superpoint_labels:main"
bb-organize-3d-obs = "bb_utils.data_preparation.organize_3d_observations:main"
bb-cache-world-coords = "bb_utils.data_preparation.world_coords_cache:main"
bb-analyze-decay-rate = "bb_utils.confidence_decay_analysis.cli:main"

[project.optional-dependencies]
percentiles = ["tdigest>=0.5.2"]
plotting = ["matplotlib>=3.7.0"]
all = ["tdigest>=0.5.2", "matplotlib>=3.7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

